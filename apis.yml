name: L2
description: 'L2 Inc was a subscription research and business intelligence firm founded in New York
  City in 2010 by NYU Stern marketing professor Scott Galloway and co-founder Maureen Mullen. L2
  benchmarked the digital competence of consumer brands, publishing more than 25 Digital IQ Index
  reports each year covering over 2,200 brands across fashion, luxury, retail, beauty, financial
  services, hospitality and consumer packaged goods. Its research scored brands on site experience,
  e-commerce, digital marketing, social media and mobile execution, and was sold as a subscription
  to CMOs and senior marketing leaders. The firm raised roughly $16.5 million in venture funding,
  including backing from General Catalyst (Larry Bohn and Paul Sagan) from 2014. Gartner acquired
  L2 in March 2017, when it had about 150 employees across New York and London, and folded the
  Digital IQ research into Gartner for Marketers. L2 never operated a public developer program or
  API: its research was delivered through a subscriber web platform and published reports. The
  l2inc.com domain is registered but no longer resolves, and no L2-branded developer, documentation
  or API surface remains online. This profile is retained as an acquired-company record with no
  API artifacts.'
